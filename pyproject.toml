[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keepassxc-mcp"
version = "0.1.0"
description = "MCP server for KeePassXC via the browser integration protocol"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Peter Reginald", email = "peter@digitalsanctum.com.au"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "pynacl>=1.5.0",
]
keywords = ["keepassxc", "mcp", "password-manager", "credentials"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/preginald/keepassxc-mcp"
Issues = "https://github.com/preginald/keepassxc-mcp/issues"

[project.scripts]
keepassxc-mcp = "keepassxc_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/keepassxc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
